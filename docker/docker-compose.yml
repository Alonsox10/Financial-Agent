services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: financial-agent-postgres
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen nombrado: los datos sobreviven a `docker compose down`
      # (solo `down -v` los borraría).
      - postgres_data:/var/lib/postgresql/data
      # Los .sql se ejecutan en orden alfabético SOLO en el primer arranque
      # (cuando pgdata está vacío); de ahí el prefijo numérico 001_.
      - ../app/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: financial-agent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redisdata:
